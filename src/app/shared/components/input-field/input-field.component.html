<div class="field w-full">
  <!-- Label con asterisco si es requerido -->
  <label class="block mb-1 font-medium">
    {{ label }}
    <span *ngIf="required" class="text-red-500">*</span>
  </label>
  <p-iconField class="w-full"> 
    <p-inputIcon [class]="icon"> 
    </p-inputIcon>
      <input
        [type]="type"
        pInputText
        [placeholder]="placeholder"
        [value]="value"
        (input)="onInput($event)"
        (blur)="onTouched()"
        class="w-full"
      />
  </p-iconField>
  <!-- Mensajes de error -->
  <div
    *ngIf="control?.invalid && (control?.touched || control?.dirty)"
    class="text-red-500 text-sm mt-1"
  >
    <div *ngIf="control?.errors?.['required']">{{ label }} es requerido.</div>
    <div *ngIf="control?.errors?.['email']">
      Por favor ingresa un correo válido.
    </div>
    <div *ngIf="control?.errors?.['minlength']">
      {{ label }} debe tener al menos
      {{ control?.errors?.['minlength'].requiredLength }} caracteres.
    </div>
    <div *ngIf="control?.errors?.['maxlength']">
      {{ label }} no puede superar
      {{ control?.errors?.['maxlength'].requiredLength }} caracteres.
    </div>
  </div>
</div>
