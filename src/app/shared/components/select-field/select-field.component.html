<div class="field w-full">
  <!-- Label con asterisco si es requerido -->
  <label class="block mb-1 font-medium">
    {{ label }}
    <span *ngIf="isRequired" class="text-red-500">*</span>
  </label>

  <p-select
    [options]="options"
    [formControl]="control!"
    optionLabel="label"
    optionValue="value"
    (onChange)="onSelectChange($event.value)"
    [placeholder]="placeholder"
    [disabled]="disabled"
    class="w-full"
  ></p-select>

  <!-- Mensajes de error -->
  <div
    *ngIf="control?.invalid && (control?.dirty || control?.touched)"
    class="text-red-500 text-sm mt-1"
  >
    <div *ngIf="control?.errors?.['required']">{{ label }} es requerido.</div>
  </div>
</div>
